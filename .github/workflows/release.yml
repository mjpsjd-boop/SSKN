name: Release APK on Tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SSKN-NEET-Biology-v${{ github.ref_name || inputs.tag_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SSKN Release ${{ github.ref_name || inputs.tag_name }}"
          tag_name: "${{ github.ref_name || inputs.tag_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## SSKN NEET Biology ${{ github.ref_name || inputs.tag_name }}

            This release includes the complete PDF-backed Biology library:

            - 22 Class 11 Biology chapter PDFs
            - 14 Class 12 Biology chapter PDFs
            - Original PDF page rendering with page-specific Scan, Ask, and MCQ actions
            - Updated spacing and reader controls to prevent UI overlap

            Download the APK below and install it on your Android device.
          files: |
            SSKN-NEET-Biology-v${{ github.ref_name || inputs.tag_name }}.apk
